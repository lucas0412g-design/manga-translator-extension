name: Montar pacote da extensão

# Compilação e verificações no GitHub: usuários não precisam de Node.js.
on:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install --no-fund

      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Copiar OCR e idiomas para vendor/
        run: npm run setup

      - name: Testes de funções auxiliares
        run: npm test

      - name: Teste real de OCR em inglês e espanhol
        run: npm run test:ocr

      - name: Separar somente arquivos da extensão
        run: |
          mkdir -p dist/ext
          cp -r manifest.json lib.js background.js content.js popup.html popup.css popup.js icons vendor dist/ext/
          test -s dist/ext/vendor/tesseract.min.js
          test -s dist/ext/vendor/worker.min.js
          test -s dist/ext/vendor/lang/eng.traineddata.gz
          test -s dist/ext/vendor/lang/spa.traineddata.gz

      - name: Verificar a extensão (web-ext lint)
        run: npx web-ext lint --source-dir dist/ext
        # Erros interrompem o build. Avisos da biblioteca OCR não são escondidos.

      - name: Montar ZIP
        run: |
          (cd dist/ext && zip -qr ../tradutor-manga.zip .)
          ls -lh dist/tradutor-manga.zip

      - uses: actions/upload-artifact@v4
        with:
          name: tradutor-manga
          path: dist/tradutor-manga.zip
          if-no-files-found: error

      - name: Montar pacote Microsoft Edge (Manifest V3)
        run: |
          mkdir -p dist/edge
          cp -r lib.js background.js content.js popup.css popup.js vendor dist/edge/
          cp edge/manifest.json dist/edge/manifest.json
          cp edge/popup.html edge/edge-compat.js edge/edge-offscreen.html edge/edge-offscreen-compat.js edge/edge-service-worker.js dist/edge/
          test -s dist/edge/vendor/worker.min.js
          test -s dist/edge/vendor/lang/eng.traineddata.gz
          test -s dist/edge/vendor/lang/spa.traineddata.gz
          node --check dist/edge/edge-service-worker.js
          node --check dist/edge/edge-offscreen-compat.js
          node --check dist/edge/edge-compat.js
          node -e "const m=require('./dist/edge/manifest.json'); if(m.manifest_version!==3 || !m.background.service_worker || !m.permissions.includes('offscreen')) process.exit(1)"
          (cd dist/edge && zip -qr ../tradutor-manga-edge.zip .)
          ls -lh dist/tradutor-manga-edge.zip

      - uses: actions/upload-artifact@v4
        with:
          name: tradutor-manga-edge
          path: dist/tradutor-manga-edge.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tradutor-manga
      - name: Publicar ZIP experimental em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" tradutor-manga.zip --title "${{ github.ref_name }}" --generate-notes --prerelease
